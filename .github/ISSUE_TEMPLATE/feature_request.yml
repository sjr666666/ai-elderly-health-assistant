name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法!请说明这个功能要解决什么问题,越具体越容易被采纳。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前检查
      options:
        - label: 我已在 Issues 中搜索过,没有相同建议
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能针对什么痛点场景?
      placeholder: "例如:老人经常忘记带药,希望能……"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的实现方案
      description: 你期望的交互方式、页面位置或技术思路(可选)
  - type: textarea
    id: alternative
    attributes:
      label: 其他备选方案
      description: 是否有替代方案?(可选)
  - type: dropdown
    id: scope
    attributes:
      label: 涉及端
      options:
        - 老人端
        - 家属端
        - 后端 / AI
        - 全局 / 不确定
    validations:
      required: true
