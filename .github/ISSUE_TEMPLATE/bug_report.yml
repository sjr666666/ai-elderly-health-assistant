name: 🐛 Bug 报告
description: 提交一个 Bug 让我们修复
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告这个 Bug!请尽量填写以下信息,帮助维护者快速定位问题。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前检查
      description: 请确认已完成以下步骤,避免无效 Issue
      options:
        - label: 我已在 Issues 中搜索过,没有相同问题(包括已关闭的)
          required: true
        - label: 我已更新到最新代码,问题仍然存在
          required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 例如 Windows 11 / macOS 14 / Ubuntu 22.04
      placeholder: "Windows 11"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: Node.js / JDK / MySQL / 浏览器版本
      placeholder: "Node 18, JDK 11, MySQL 8.0, Chrome 126"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      placeholder: |
        1. 打开 xxx 页面
        2. 点击 xxx
        3. 看到报错
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      placeholder: "应该……"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: "实际却……"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志 / 截图
      description: 粘贴后端控制台报错、前端 console 报错或截图(可选)
  - type: dropdown
    id: scope
    attributes:
      label: 问题端
      options:
        - 老人端(前端)
        - 家属端(前端)
        - 后端
        - 数据库 / 初始化脚本
        - 部署 / Docker
        - 其他
    validations:
      required: true
