# Docker 镜像构建验证
# 确保 README 主打的 docker-compose 一键部署在每次提交后都能构建成功
name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t ai-elderly-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ai-elderly-frontend:ci ./frontend

      - name: Verify images exist
        run: |
          docker image inspect ai-elderly-backend:ci > /dev/null && echo "backend image OK"
          docker image inspect ai-elderly-frontend:ci > /dev/null && echo "frontend image OK"
