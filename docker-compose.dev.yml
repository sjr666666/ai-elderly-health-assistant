services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: elderly_medication
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: medication_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/src/main/resources/init_drug_data.sql:/docker-entrypoint-initdb.d/02-drug-data.sql:ro
      - ./backend/src/main/resources/init_guardian_tables.sql:/docker-entrypoint-initdb.d/03-guardian.sql:ro
      - ./backend/src/main/resources/init_weekly_report_table.sql:/docker-entrypoint-initdb.d/04-weekly-report.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      FLYWAY_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      MANAGEMENT_HEALTH_NEO4J_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/elderly_medication?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: medication_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PHONE_ENCRYPT_KEY: ${PHONE_ENCRYPT_KEY}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BAIDU_OCR_APP_ID: ${BAIDU_OCR_APP_ID:-}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      BAIDU_TTS_APP_ID: ${BAIDU_TTS_APP_ID:-}
      BAIDU_TTS_API_KEY: ${BAIDU_TTS_API_KEY:-}
      BAIDU_TTS_SECRET_KEY: ${BAIDU_TTS_SECRET_KEY:-}
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml:ro
      - ./uploads:/app/uploads
      - maven-cache:/root/.m2
    networks: [internal, dev]
    ports:
      - "8080:8080"

  frontend:
    build: !reset []
    image: node:20.16-alpine
    restart: unless-stopped
    depends_on: [backend]
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BROWSER: none
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      BACKEND_PROXY_TARGET: http://backend:8080
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/react-scripts ]; then npm install --legacy-peer-deps --no-audit --no-fund; fi && npm run start:dev"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks: !override [dev]
    ports: !override
      - "3000:3000"

networks:
  dev:
  internal:
    internal: true

volumes:
  mysql-data:
  redis-data:
  maven-cache:
  frontend-node-modules:
