# Production profile. Secrets are injected by the deployment platform.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.redis.host=${SPRING_REDIS_HOST}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.development-endpoints-enabled=false
logging.level.root=INFO
logging.level.com.example.backend=INFO
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.neo4j.enabled=false
jwt.expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
aliyun.oss.endpoint=oss-cn-shenzhen.aliyuncs.com
aliyun.oss.region=cn-shenzhen
aliyun.oss.bucket-name=aaagame-medication-images
