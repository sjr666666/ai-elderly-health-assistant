server.port=8080
spring.application.name=backend
# Flyway 数据库迁移（默认开启；老库自动 baseline 到 V1，新库自动执行 V1~V4）
# 如需完全关闭迁移：FLYWAY_ENABLED=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.development-endpoints-enabled=false

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==================== 文件上传配置 ====================
upload.path=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# ==================== HTTP编码配置 ====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==================== Jackson配置 ====================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ==================== MySQL 数据库配置 ====================
# createDatabaseIfNotExist=true 允许 Flyway 在库不存在时自动建库（需要连接账号有建库权限）
spring.datasource.url=jdbc:mysql://localhost:3306/elderly_medication?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
# 数据库密码由 application-local.properties 提供（团队成员各自设置）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.model.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== Redis 配置 ====================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# ==================== Neo4j 图数据库配置 ====================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# ==================== 阿里云OSS 配置 ====================
# 敏感凭据由 application-local.properties 提供（不入 git）
aliyun.oss.endpoint=oss-cn-beijing.aliyuncs.com
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET:}
aliyun.oss.bucket-name=cxcy-aa
aliyun.oss.region=cn-beijing

# ==================== 百度OCR 配置 ====================
baidu.ocr.app-id=${BAIDU_OCR_APP_ID:}
baidu.ocr.api-key=${BAIDU_OCR_API_KEY:}
baidu.ocr.secret-key=${BAIDU_OCR_SECRET_KEY:}
baidu.tts.appId=${BAIDU_TTS_APP_ID:}
baidu.tts.apiKey=${BAIDU_TTS_API_KEY:}
baidu.tts.secretKey=${BAIDU_TTS_SECRET_KEY:}

# 百度ASR（语音识别，老人语音问药；未配置自动降级浏览器Web Speech API）
baidu.asr.api-key=${BAIDU_ASR_API_KEY:}
baidu.asr.secret-key=${BAIDU_ASR_SECRET_KEY:}

# ==================== DeepSeek 大模型配置 ====================
deepseek.api-url=https://api.deepseek.com/v1
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.model=deepseek-chat
deepseek.timeout=30000

# ==================== RAG 用药知识库配置 ====================
# Embedding 向量化：DeepSeek 无向量接口，走 SiliconFlow bge-m3（OpenAI 兼容）
# 未配置 Key 时自动降级为内置哈希向量（链路可跑通，精度有限）
ai.embedding.api-url=https://api.siliconflow.cn/v1/embeddings
ai.embedding.api-key=${SILICONFLOW_API_KEY:}
ai.embedding.model=BAAI/bge-m3
ai.rag.top-k=3
ai.rag.ingest-on-startup=true

# ==================== 网络请求超时配置 ====================
rest.connection-timeout=10000
rest.read-timeout=60000

# AI服务专用超时配置（大模型响应较慢，需要更长读取超时）
ai.rest.connection-timeout=10000
ai.rest.read-timeout=120000

# TTS服务专用超时配置
tts.rest.connection-timeout=10000
tts.rest.read-timeout=30000

# ==================== 日志配置 ====================
logging.level.root=INFO
logging.level.com.example.backend=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}
logging.level.org.hibernate=INFO

# ==================== JWT 配置 ====================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}

# ==================== 手机号AES加密配置 ====================
# 16字节AES密钥（用于手机号等敏感字段加密存储）
phone.encrypt.key=${PHONE_ENCRYPT_KEY:}
