server.port=8080
spring.application.name=backend

# 激活本地配置（本地开发时会加载 application-local.properties
spring.profiles.active=local

# 排除未使用的服务自动配置
spring.autoconfigure.exclude=
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,
  org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration

# ==================== MySQL 数据库配置 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/elderly_medication?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.model.entity
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 注释掉全局ID类型配置，使用实体类上的 @TableId 注解配置
# mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== Redis 配置 ====================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=your_redis_password
spring.redis.database=0
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# ==================== RabbitMQ 配置 ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# ==================== MinIO 对象存储配置 ====================
minio.endpoint=http://localhost:9000
minio.access-key=your_access_key
minio.secret-key=your_secret_key
minio.bucket-name=your_bucket_name
minio.secure=false

# ==================== 阿里云OSS 配置 ====================
aliyun.oss.endpoint=oss-cn-hangzhou.aliyuncs.com
aliyun.oss.access-key-id=your_access_key_id
aliyun.oss.access-key-secret=your_access_key_secret
aliyun.oss.bucket-name=your_bucket_name
aliyun.oss.region=cn-hangzhou

