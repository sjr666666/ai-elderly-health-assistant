server.port=8080
spring.application.name=backend

spring.profiles.active=local

# ==================== 文件上传配置 ====================
upload.path=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# ==================== HTTP编码配置 ====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==================== Jackson配置 ====================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ==================== MySQL 数据库配置 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/elderly_medication?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 数据库密码由 application-local.properties 提供（团队成员各自设置）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.model.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== Redis 配置 ====================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=dev_redis_password
spring.redis.database=0
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# ==================== Neo4j 图数据库配置 ====================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=dev_neo4j_password

# ==================== 阿里云OSS 配置 ====================
# 敏感凭据由 application-local.properties 提供（不入 git）
aliyun.oss.endpoint=oss-cn-beijing.aliyuncs.com
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET:}
aliyun.oss.bucket-name=cxcy-aa
aliyun.oss.region=cn-beijing

# ==================== 百度OCR 配置 ====================
baidu.ocr.app-id=${BAIDU_OCR_APP_ID:}
baidu.ocr.api-key=${BAIDU_OCR_API_KEY:}
baidu.ocr.secret-key=${BAIDU_OCR_SECRET_KEY:}
baidu.tts.appId=${BAIDU_TTS_APP_ID:}
baidu.tts.apiKey=${BAIDU_TTS_API_KEY:}
baidu.tts.secretKey=${BAIDU_TTS_SECRET_KEY:}

# ==================== DeepSeek 大模型配置 ====================
deepseek.api-url=https://api.deepseek.com/v1
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.model=deepseek-chat
deepseek.timeout=30000

# ==================== 网络请求超时配置 ====================
rest.connection-timeout=10000
rest.read-timeout=60000

# ==================== 日志配置 ====================
logging.level.root=INFO
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
