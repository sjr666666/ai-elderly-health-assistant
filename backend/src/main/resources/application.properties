# ==================== Neo4j 图数据库配置 ====================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=your_neo4j_password

# ==================== 日志配置 ====================
# 根日志级别设置为WARN，减少大部分框架输出
logging.level.root=WARN
# 只保留自己代码的INFO级别日志
logging.level.com.example.backend=INFO
# Spring Web设置为WARN，减少请求处理日志
logging.level.org.springframework.web=WARN
# Hibernate设置为WARN，减少SQL日志
logging.level.org.hibernate=WARN
# MyBatis-Plus设置为WARN，减少SQL日志
logging.level.com.baomidou.mybatisplus=WARN
# Tomcat设置为WARN，减少服务器日志
logging.level.org.apache.catalina=WARN
# Security设置为WARN，减少安全框架日志
logging.level.org.springframework.security=WARN

# ==================== 文件上传配置 ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0

# 上传文件存储路径（相对于backend目录）
upload.path=./uploads
