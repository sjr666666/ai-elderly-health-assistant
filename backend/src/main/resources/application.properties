server.port=8080
spring.application.name=backend

spring.profiles.active=local
spring.profiles.include=dev

spring.datasource.url=jdbc:mysql://localhost:3306/elderly_medication?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 数据库密码由 application-local.properties 提供（团队成员各自设置）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=dev_redis_password
spring.redis.database=0

deepseek.api-url=https://api.deepseek.com/v1
deepseek.api-key=sk-***REDACTED***
deepseek.model=deepseek-chat
deepseek.timeout=30000

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.backend.model.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

logging.level.root=INFO
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.web=DEBUG