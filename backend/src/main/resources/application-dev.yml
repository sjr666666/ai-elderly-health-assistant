server:
  port: 8080

upload:
  path: ./uploads

spring:
  application:
    name: backend

  # ==================== HTTP编码配置 ====================
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  # ==================== Jackson配置 ====================
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # ==================== MySQL 数据库配置 ====================
  datasource:
    url: jdbc:mysql://localhost:3306/elderly_medication?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码由 application-local.properties 提供（团队成员各自设置）
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.backend.model.entity
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    # 注释掉全局ID类型配置，使用实体类上的 @TableId 注解配置
    # db-config:
    #   id-type: auto
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

  # ==================== Redis 配置 ====================
  redis:
    host: localhost
    port: 6379
    password: dev_redis_password
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  # ==================== Neo4j 图数据库配置 ====================
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: dev_neo4j_password

