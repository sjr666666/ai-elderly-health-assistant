services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: elderly_medication
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: medication_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/init_database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/src/main/resources/init_drug_data.sql:/docker-entrypoint-initdb.d/02-drug-data.sql:ro
      - ./backend/src/main/resources/init_guardian_tables.sql:/docker-entrypoint-initdb.d/03-guardian.sql:ro
      - ./backend/src/main/resources/init_weekly_report_table.sql:/docker-entrypoint-initdb.d/04-weekly-report.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/elderly_medication?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: medication_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PHONE_ENCRYPT_KEY: ${PHONE_ENCRYPT_KEY:?PHONE_ENCRYPT_KEY is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BAIDU_OCR_APP_ID: ${BAIDU_OCR_APP_ID:-}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      BAIDU_TTS_APP_ID: ${BAIDU_TTS_APP_ID:-}
      BAIDU_TTS_API_KEY: ${BAIDU_TTS_API_KEY:-}
      BAIDU_TTS_SECRET_KEY: ${BAIDU_TTS_SECRET_KEY:-}
    volumes:
      - uploads-data:/app/uploads
    networks: [internal, edge]
    expose: ["8080"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [edge]
    ports:
      - "${HTTP_PORT:-80}:80"

networks:
  internal:
    internal: true
  edge:

volumes:
  mysql-data:
  redis-data:
  uploads-data:
